[project]
name = "envarium"
version = "0.1.0"
description = "Windows 桌面端 Python 环境发现与管理工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "platformdirs>=4.3",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.gui-scripts]
envarium = "envarium.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envarium"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: 依赖真实机器的测试"]
